x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 3000
  APP_BASE_URL: http://localhost:3000
  DATABASE_URL: postgresql://ntumba:ntumba@database:5432/ntumba
  SERVE_WEB: "true"
  JOBS_ENABLED: "true"
  RATE_PROVIDER_MODE: fake
  STATIC_BTC_ZMW_RATE: "1800000.00"
  BRIDGE_ENGINE_MODE: disabled
  BITCOIN_LIQUIDITY_RAIL_MODE: fake
  MOBILE_MONEY_LIQUIDITY_RAIL_MODE: fake
  FAKE_BITCOIN_TREASURY_BALANCE_SATS: "5000000"
  FAKE_BITCOIN_TREASURY_INBOUND_CAPACITY_SATS: "10000000"
  FAKE_BITCOIN_TREASURY_OUTBOUND_CAPACITY_SATS: "5000000"
  FAKE_LIPILA_BALANCE_ZMW_MINOR: "5000000"
  SETTLEMENT_DESTINATION_TTL_SECONDS: "300"
  QUOTE_RETENTION_SECONDS: "3600"
  INTENT_RETENTION_SECONDS: "86400"

x-app-service: &app-service
  build:
    context: .
  depends_on:
    database:
      condition: service_healthy
  environment: *app-environment

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ntumba
      POSTGRES_PASSWORD: ntumba
      POSTGRES_USER: ntumba
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntumba -d ntumba"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - ntumba-postgres:/var/lib/postgresql

  app:
    <<: *app-service
    profiles: ["production"]
    ports:
      - "3000:3000"

  ops-app:
    <<: *app-service
    profiles: ["ops"]
    environment:
      <<: *app-environment
      NTUMBA_BUILD_COMMIT: ${NTUMBA_BUILD_COMMIT:-unknown}
      OPS_ENABLED: "true"
      OPS_HOST: 0.0.0.0
      OPS_METRICS_TOKEN_FILE: /run/secrets/ops_metrics_token
      OPS_PORT: 9091
    ports:
      - "3000:3000"
    secrets:
      - ops_metrics_token

  prometheus:
    profiles: ["ops"]
    image: prom/prometheus:v3.13.0-distroless
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    depends_on:
      - ops-app
    secrets:
      - ops_metrics_token
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ntumba-prometheus:/prometheus

  grafana:
    profiles: ["ops"]
    image: grafana/grafana:13.1.0
    depends_on:
      - prometheus
    environment:
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-ntumba-operator}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    secrets:
      - grafana_admin_password
    volumes:
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ntumba-grafana:/var/lib/grafana

volumes:
  ntumba-grafana:
  ntumba-postgres:
  ntumba-prometheus:

secrets:
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD
  ops_metrics_token:
    environment: OPS_METRICS_TOKEN

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ntumba
      POSTGRES_PASSWORD: ntumba
      POSTGRES_USER: ntumba
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntumba -d ntumba"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - ntumba-postgres:/var/lib/postgresql/data

  app:
    profiles: ["production"]
    build:
      context: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://ntumba:ntumba@database:5432/ntumba
      SERVE_WEB: "true"
      JOBS_ENABLED: "true"
      RATE_PROVIDER_MODE: fake
      STATIC_BTC_ZMW_RATE: "1800000.00"
      SETTLEMENT_PROVIDER_MODE: fake
      QUOTE_RETENTION_SECONDS: "3600"
      INTENT_RETENTION_SECONDS: "86400"
    ports:
      - "3000:3000"

volumes:
  ntumba-postgres:

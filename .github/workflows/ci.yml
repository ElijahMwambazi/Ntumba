name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ntumba_test
          POSTGRES_PASSWORD: ntumba
          POSTGRES_USER: ntumba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ntumba -d ntumba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ntumba:ntumba@localhost:5432/ntumba_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Cache Yarn packages
        uses: actions/cache@v5
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-${{ runner.arch }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-yarn-

      - name: Verify toolchain
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate
        run: yarn check

      - name: Verify PostgreSQL settlement saga
        run: yarn test:integration

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Verify production PWA shell
        run: yarn test:pwa

      - name: Run end-to-end tests
        run: yarn test:e2e
